server {
    listen 8080;
    server_name _;

    # La página de la tienda.
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Todo lo que empiece por /api va al backend. ${API_URL} lo sustituye el
    # entrypoint de la imagen al arrancar (envsubst sobre /etc/nginx/templates),
    # así que el destino sale del ConfigMap `web-config` y no de esta línea.
    # El nombre `api` lo resuelve CoreDNS dentro del clúster; en docker compose,
    # la red de Docker.
    location /api/ {
        proxy_pass         ${API_URL};
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    # Las probes del Deployment apuntan aquí.
    location = /healthz { access_log off; return 200 "vivo\n"; }
    location = /readyz  { access_log off; return 200 "listo\n"; }
}
