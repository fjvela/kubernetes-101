# agent — recoge los logs del nodo. Vive en `plataforma`, no en `tienda`:
# monta un hostPath, y eso lo prohíbe el nivel baseline de la aplicación.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa
  namespace: plataforma
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: tienda
---
# Puede leer los Pods de `tienda` para etiquetar los logs con su origen.
# Fíjate: el RoleBinding vive en `tienda`, pero el sujeto está en `plataforma`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lector-pods
  namespace: tienda
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-lector-pods
  namespace: tienda
subjects:
  - kind: ServiceAccount
    name: agent-sa
    namespace: plataforma
roleRef:
  kind: Role
  name: lector-pods
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: plataforma
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Daemon       Off
        Log_Level    info
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Tag               kube.*
        Refresh_Interval  10
        Skip_Long_Lines   On

    [OUTPUT]
        Name   stdout
        Match  *
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: plataforma
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: tienda
spec:
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: tienda
    spec:
      serviceAccountName: agent-sa
      tolerations:
        - operator: Exists       # también en los nodos del control plane
      containers:
        - name: agent
          image: fluent/fluent-bit:3.0
          ports:
            - containerPort: 2020
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
            - name: logs-del-nodo
              mountPath: /var/log
              readOnly: true
          resources:
            requests:
              cpu: "5m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
      volumes:
        - name: config
          configMap:
            name: agent-config
        - name: logs-del-nodo
          hostPath:
            path: /var/log
